{% extends "base.html" %}{% block t %}Set new password{% endblock %}{% block b %}
<div class="authwrap">
<div class="logo"><div class="mark">TechXpert Outreach</div></div>
<div class="card">
<h1>Choose a new password</h1>
{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form method="post">
<p><label><small>New password (min 8 characters)</small></label><input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Choose a new password"></p>
<p><button type="submit" style="width:100%">Set new password</button></p>
</form>
<p style="text-align:center"><small><a href="/login">Back to log in</a></small></p>
</div>
</div>
{% endblock %}
