{% extends "base.html" %}{% block t %}New campaign{% endblock %}{% block b %}
<h1>New campaign</h1>
<div class="card"><form method="post">
<p><label><small>Campaign name</small></label><input name="name" value="HVAC Phoenix"></p>
<div class="row"><div><label><small>Niche (e.g. HVAC contractor)</small></label><input name="niche" value="HVAC contractor"></div>
<div><label><small>Location (e.g. Phoenix AZ)</small></label><input name="location" value="Phoenix AZ"></div></div>
<p><label><small>ICP notes (who exactly is this for?)</small></label><textarea name="icp_notes" rows="3" placeholder="e.g. Owner-operated shops, 5-20 techs, no in-house marketing"></textarea></p>
<p><label><small>Subject</small></label><input name="subject_tpl" value="Quick question for {business_name}"></p>
<p><label><small>Body (variables: {business_name} {phone} {website} {category} {personalized_line} / spintax: {a|b})</small></label>
<textarea name="body_tpl" rows="7">Hi {business_name} team,

{Quick question|Had a quick question} about how you handle jobs in your area.

Worth a 10-minute chat?

Best</textarea></p>
<div class="row">
<div><label><small>Delay min (s)</small></label><input type="number" name="delay_min" value="60"></div>
<div><label><small>Delay max (s)</small></label><input type="number" name="delay_max" value="120"></div>
<div><label><small>Window start (server time, UTC on Vercel)</small></label><input type="time" name="window_start" value="09:00"></div>
<div><label><small>Window end (server time, UTC on Vercel)</small></label><input type="time" name="window_end" value="17:00"></div></div>
<p><label><input type="checkbox" name="dry_run" checked style="width:auto"> Dry-run mode (log, don't send)</label></p>
<p><button type="submit">Create campaign</button></p>
</form></div>
{% endblock %}
