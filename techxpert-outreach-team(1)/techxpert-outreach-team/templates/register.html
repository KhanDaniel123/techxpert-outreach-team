{% extends "base.html" %}{% block t %}Create account{% endblock %}{% block b %}
<div class="authwrap">
<div class="logo"><div class="mark">TechXpert Outreach</div></div>
<div class="card">
<h1>Create your account</h1>
{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form method="post">
<p><label><small>Name</small></label><input name="name" autocomplete="name" placeholder="Your name"></p>
<p><label><small>Email</small></label><input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></p>
<p><label><small>Password (min 8 characters)</small></label><input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Choose a password"></p>
<p><button type="submit" style="width:100%">Create account</button></p>
</form>
<p style="text-align:center"><small>Already have one? <a href="/login">Log in</a></small></p>
</div>
</div>
{% endblock %}
