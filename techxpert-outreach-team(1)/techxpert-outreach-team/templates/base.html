<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block t %}TechXpert Outreach{% endblock %}</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;color:#1a1a1a;background:#fafafa}
nav{background:#111;color:#fff;padding:10px 16px;border-radius:8px;margin-bottom:20px;display:flex;gap:16px;align-items:center}
nav a{color:#ffd34d;text-decoration:none;font-weight:600}
nav .who{margin-left:auto;color:#bbb;font-size:13px}
.card{background:#fff;border:1px solid #e3e3e3;border-radius:10px;padding:16px;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #eee;padding:8px 6px;text-align:left;vertical-align:top}
th{background:#f5f5f5}
input,select,textarea{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;width:100%;box-sizing:border-box}
textarea{font-family:monospace}
button,.btn{background:#111;color:#ffd34d;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
button.warn{background:#a33;color:#fff}
button.ghost{background:#eee;color:#111}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:180px}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.ok{background:#dff5df}.bad{background:#fdd}.mut{background:#eee}
small{color:#666}.mono{font-family:monospace;font-size:12px}
h1{font-size:24px}h2{font-size:19px;margin-top:0}
</style></head><body>
<nav><a href="/dashboard">TechXpert Outreach</a><a href="/accounts">Gmail accounts</a><a href="/logs">Send log</a>{% if user %}<a href="/logout">Logout</a><span class="who">{{ user.email }}</span>{% endif %}</nav>
{% block b %}{% endblock %}
</body></html>
